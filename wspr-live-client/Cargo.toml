[package]
name = "wspr-live-client"
version = "0.1.0"
edition = "2024"
description = "Small read-only Rust client for wspr.live reception reports"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "receiving"
path = "examples/receiving.rs"
